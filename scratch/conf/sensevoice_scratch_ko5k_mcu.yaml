# SenseVoice-Small scratch retraining (Korean-only, 5000 BPE)
# - 공식 SenseVoiceSmall 구조에서 task embedding / rich CE / task query concat 제거
# - encoder 블록: num_blocks=24 (원본 70에서 축소)
# - CMVN은 KsponSpeech에서 재계산 필요 → scripts/compute_kspon_cmvn.py
# 서버 경로: /deepet/jh/sensevoice/finetune/scratch/

encoder: SenseVoiceEncoderSmall
encoder_conf:
    output_size: 512
    attention_heads: 4
    linear_units: 1024
    num_blocks: 6
    tp_blocks: 0
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    attention_dropout_rate: 0.1
    input_layer: pe
    pos_enc_class: SinusoidalPositionEncoder
    normalize_before: true
    kernel_size: 11
    sanm_shfit: 0
    selfattention_layer_type: sanm

model: SenseVoiceSmallCTCScratch
model_conf:
    length_normalized_loss: true
    blank_id: 0
    ignore_id: -1

tokenizer: SentencepiecesTokenizer
tokenizer_conf:
    bpemodel: /deepet/jh/sensevoice/finetune/scratch/assets/lang_bpe_5000/bpe.model
    unk_symbol: <unk>
    split_with_space: true

frontend: WavFrontend
frontend_conf:
    fs: 16000
    window: hamming
    n_mels: 80
    frame_length: 25
    frame_shift: 10
    lfr_m: 7
    lfr_n: 6
    cmvn_file: /deepet/jh/sensevoice/finetune/scratch/assets/kspon.mvn

dataset: SenseVoiceCTCDatasetNoTask
dataset_conf:
    index_ds: IndexDSJsonl
    batch_sampler: EspnetStyleBatchSampler
    data_split_num: 2
    batch_type: token
    batch_size: 80000
    max_token_length: 2000
    min_token_length: 60
    max_source_length: 2000
    min_source_length: 60
    max_target_length: 200
    min_target_length: 1
    shuffle: true
    num_workers: 4
    IndexDSJsonl: IndexDSJsonl
    retry: 20

train_conf:
    accum_grad: 2
    grad_clip: 5
    max_epoch: 40
    keep_nbest_models: -1
    avg_nbest_model: 5
    log_interval: 100
    resume: true
    validate_interval: 1000
    save_checkpoint_interval: 1000

optim: adamw
optim_conf:
    lr: 0.0005
    betas: [0.9, 0.98]
    weight_decay: 0.0005
scheduler: warmuplr
scheduler_conf:
    warmup_steps: 25000

specaug: SpecAugLFR
specaug_conf:
    apply_time_warp: false
    time_warp_window: 5
    time_warp_mode: bicubic
    apply_freq_mask: true
    freq_mask_width_range: [0, 30]
    lfr_rate: 6
    num_freq_mask: 1
    apply_time_mask: true
    time_mask_width_range: [0, 12]
    num_time_mask: 1
